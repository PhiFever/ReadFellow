[project]
name = "readfellow"
version = "0.1.0"
description = "Local document indexing and retrieval helpers for agent-assisted reading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "zvec>=0.5.1",
]

[project.scripts]
readfellow = "readfellow.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readfellow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
