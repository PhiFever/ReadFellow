[project]
name = "readfellow"
version = "0.1.0"
description = "Local document indexing and retrieval helpers for agent-assisted reading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "numpy>=2.5.4",
    "openai>=3.13.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
readfellow = "readfellow.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readfellow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# 全量 `uv run pytest` 只跑 tests/。
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
openai = { msg = "openai 只在 openai_compat.py 里 import，其余模块经生成接口访问" }
sqlite3 = { msg = "sqlite3 只在 library.py 里 import" }

[tool.ruff.lint.per-file-ignores]
"src/readfellow/openai_compat.py" = ["TID251"]
"src/readfellow/library.py" = ["TID251"]
"tests/test_openai_compat.py" = ["TID251"]
